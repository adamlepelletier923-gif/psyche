</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root{
  --bg:#F7F3F8;--surface:#FFFFFF;--surface-2:#EFE8F2;--ink:#231A28;--muted:#6A5D70;--line:#E2D8E6;--line-2:#CFC2D5;
  --brand:#7B3F9E;--brand-dark:#5A2C75;--brand-soft:#EEE2F5;
  --ok:#2E9E5B;--ok-dark:#237A46;--ok-soft:#E1F5E8;--ok-ink:#1B6B3B;
  --bad:#D9483B;--bad-dark:#A93329;--bad-soft:#FBE4E1;--bad-ink:#9E2E22;
  --gold:#E3A72F;--gold-dark:#B8841E;--gold-soft:#FBF1DC;
  --sel:#2A7FC9;--sel-soft:#E0EEFA;
  --u1:#7B3F9E;--u1d:#5A2C75;--u2:#B5446E;--u2d:#862F50;--u3:#2F7386;--u3d:#215462;--u4:#C2410C;--u4d:#8F300A;--u5:#4E7A2B;--u5d:#38591E;--u6:#9D2B2B;--u6d:#731F1F;--u7:#3F51B5;--u7d:#2E3B85;--u8:#8C5A2B;--u8d:#664020;--u9:#0E7490;--u9d:#0A566B;--u10:#B77A14;--u10d:#87590E;--u11:#6E48A6;--u11d:#50337B;--u12:#1E7A5C;--u12d:#155A44;--u13:#A23B72;--u13d:#78295A;
  --sans:"Nunito","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141016;--surface:#1E1821;--surface-2:#2A2230;--ink:#F2ECF4;--muted:#B3A6B8;--line:#352B3A;--line-2:#46394C;
    --brand:#C08BE0;--brand-dark:#9466B5;--brand-soft:#2D1F38;
    --ok:#3DBA6E;--ok-dark:#2B8A50;--ok-soft:#173B2A;--ok-ink:#8FE0B0;
    --bad:#E8604F;--bad-dark:#B2403A;--bad-soft:#3F211B;--bad-ink:#F5A79B;
    --gold:#E7B44A;--gold-dark:#B98C2C;--gold-soft:#3A2E13;
    --sel:#4FA8E8;--sel-soft:#173246;
    --u1:#C08BE0;--u1d:#9466B5;--u2:#E07FA3;--u2d:#B85E80;--u3:#5FAEC4;--u3d:#3F8598;--u4:#F08A4B;--u4d:#C96B32;--u5:#8DBA5A;--u5d:#6A9140;--u6:#E07A7A;--u6d:#B85C5C;--u7:#8C9BE8;--u7d:#6B7AC4;--u8:#C99462;--u8d:#A37447;--u9:#4FB8D4;--u9d:#3494AE;--u10:#E0A83A;--u10d:#B7862A;--u11:#A98BD8;--u11d:#8367B0;--u12:#3FA57E;--u12d:#2B7A5C;--u13:#D77BA8;--u13d:#B35C88;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141016;--surface:#1E1821;--surface-2:#2A2230;--ink:#F2ECF4;--muted:#B3A6B8;--line:#352B3A;--line-2:#46394C;
  --brand:#C08BE0;--brand-dark:#9466B5;--brand-soft:#2D1F38;
  --ok:#3DBA6E;--ok-dark:#2B8A50;--ok-soft:#173B2A;--ok-ink:#8FE0B0;
  --bad:#E8604F;--bad-dark:#B2403A;--bad-soft:#3F211B;--bad-ink:#F5A79B;
  --gold:#E7B44A;--gold-dark:#B98C2C;--gold-soft:#3A2E13;
  --sel:#4FA8E8;--sel-soft:#173246;
  --u1:#C08BE0;--u1d:#9466B5;--u2:#E07FA3;--u2d:#B85E80;--u3:#5FAEC4;--u3d:#3F8598;--u4:#F08A4B;--u4d:#C96B32;--u5:#8DBA5A;--u5d:#6A9140;--u6:#E07A7A;--u6d:#B85C5C;--u7:#8C9BE8;--u7d:#6B7AC4;--u8:#C99462;--u8d:#A37447;--u9:#4FB8D4;--u9d:#3494AE;--u10:#E0A83A;--u10d:#B7862A;--u11:#A98BD8;--u11d:#8367B0;--u12:#3FA57E;--u12d:#2B7A5C;--u13:#D77BA8;--u13d:#B35C88;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.screen{display:flex;flex-direction:column;flex:1;min-height:100%}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}

/* 3D buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:15px;letter-spacing:.03em;text-transform:uppercase;padding:14px 20px;border-radius:14px;background:var(--brand);color:#fff;box-shadow:0 4px 0 var(--brand-dark);transition:transform .06s,box-shadow .06s;user-select:none;text-decoration:none}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--brand-dark)}
.btn:disabled{background:var(--surface-2);color:var(--muted);box-shadow:0 4px 0 var(--line-2)}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 var(--ok-dark)}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 var(--bad-dark)}
.btn.ghost{background:var(--surface);color:var(--brand);box-shadow:0 4px 0 var(--line-2);border:2px solid var(--line)}
.btn.wide{width:100%}

/* Home */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;letter-spacing:-.01em}
.logo svg{width:28px;height:28px}
.stats{display:flex;gap:10px}
.stat{display:flex;align-items:center;gap:5px;font-weight:900;font-size:15px;padding:5px 10px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line)}
.stat svg{width:18px;height:18px}
.stat.fire{color:#E0632B}.stat.xp{color:var(--gold-dark)}
.home{padding:16px 16px 110px;display:flex;flex-direction:column;gap:22px}
.hero{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px}
.hero h1{font-size:22px;font-weight:900;margin-bottom:4px}
.hero p{margin:0 0 12px;color:var(--muted);font-size:14.5px}
.hero .row{display:flex;gap:10px;flex-wrap:wrap}
.hero .row .btn{flex:1;min-width:150px;font-size:13px;padding:12px 14px}
.prog{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .4s}
.prog-l{font-size:12.5px;color:var(--muted);font-weight:700}
.unit{border-radius:18px;overflow:hidden;border:1.5px solid var(--line);background:var(--surface)}
.unit-h{padding:14px 16px;color:#fff;background:var(--c);display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.unit-h .n{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.unit-h h2{font-size:18px;font-weight:900;margin-top:2px}
.unit-h .who{font-size:12.5px;opacity:.9;margin-top:2px;font-weight:700}
.unit-h .crown{flex:none;display:flex;align-items:center;gap:4px;font-weight:900;font-size:14px;background:rgba(0,0,0,.18);padding:5px 10px;border-radius:999px}
.unit-h .crown svg{width:16px;height:16px}
.path{padding:18px 16px 8px;display:flex;flex-direction:column;gap:10px}
.node{display:flex;align-items:center;gap:14px;text-align:left;padding:8px;border-radius:14px;width:100%}
.node:hover{background:var(--surface-2)}
.node .disc{flex:none;width:58px;height:58px;border-radius:50%;background:var(--surface-2);border:3px solid var(--line-2);box-shadow:0 5px 0 var(--line-2);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:var(--muted);transition:transform .06s,box-shadow .06s}
.node:active .disc{transform:translateY(5px);box-shadow:0 0 0 var(--line-2)}
.node.done .disc{background:var(--c);border-color:var(--c);box-shadow:0 5px 0 var(--cd);color:#fff}
.node.gold .disc{background:var(--gold);border-color:var(--gold);box-shadow:0 5px 0 var(--gold-dark);color:#fff}
.node.next .disc{background:var(--surface);border-color:var(--c);box-shadow:0 5px 0 var(--cd);color:var(--c)}
.node .disc svg{width:26px;height:26px}
.node .t{font-weight:900;font-size:15.5px}
.node .s{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:1px}
.node.next .t{color:var(--c)}
.node:nth-child(odd){padding-left:8px}
.node:nth-child(even){padding-left:44px}
.node:nth-child(3n){padding-left:80px}
.foot-note{font-size:12.5px;color:var(--muted);text-align:center;font-weight:700;padding:0 8px}
.foot-note a{color:var(--brand)}

/* Lesson */
.lesson{padding:0 16px calc(120px + env(safe-area-inset-bottom,0px));flex:1}
.lbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:flex;align-items:center;gap:12px;padding:12px 0 10px}
.lbar .x{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px;font-weight:900;flex:none}
.lbar .x:hover{background:var(--surface-2)}
.lbar .pb{flex:1;height:14px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.lbar .pb i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .35s;position:relative}
.lbar .pb i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:999px;background:rgba(255,255,255,.35)}
.lbar .cnt{font-weight:900;color:var(--muted);font-size:13px;flex:none;min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.kind{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--c,var(--brand));margin:10px 0 6px}
.qtext{font-size:20px;font-weight:900;line-height:1.3;margin-bottom:18px}
.qtext .gap{display:inline-block;min-width:110px;border-bottom:3px solid var(--line-2);padding:0 6px;text-align:center;color:var(--sel);vertical-align:bottom;line-height:1.2}
.qtext .gap.filled{border-color:var(--sel)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);box-shadow:0 3px 0 var(--line);font-weight:700;font-size:15.5px;line-height:1.3;transition:transform .06s,box-shadow .06s}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:var(--muted)}
.opt.sel{border-color:var(--sel);background:var(--sel-soft);box-shadow:0 3px 0 var(--sel);color:var(--sel)}
.opt.sel .k{border-color:var(--sel);color:var(--sel)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 3px 0 var(--ok);color:var(--ok-ink)}
.opt.right .k{border-color:var(--ok);color:var(--ok-ink)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad);color:var(--bad-ink)}
.opt.wrong .k{border-color:var(--bad);color:var(--bad-ink)}
.opt:disabled{opacity:.92}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf .opt{justify-content:center;font-size:17px;padding:20px 10px;font-weight:900}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.chipb{padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);box-shadow:0 3px 0 var(--line);font-weight:800;font-size:15px;transition:transform .06s,box-shadow .06s}
.chipb:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.chipb.used{opacity:.35}
.chipb.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-ink);box-shadow:0 3px 0 var(--ok)}
.chipb.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad-ink);box-shadow:0 3px 0 var(--bad)}
.assoc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.assoc .opt{min-height:64px;justify-content:center;text-align:center;font-size:14px;padding:10px}
.assoc .opt.gone{opacity:.28;border-style:dashed;box-shadow:none;transform:none}
.assoc .opt.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.slots{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.slot{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 10px;border-radius:12px;border:2px dashed var(--line-2);background:var(--surface-2);font-weight:800;text-align:left;font-size:15px}
.slot .i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:var(--muted)}
.slot.full{border-style:solid;border-color:var(--sel);background:var(--sel-soft)}
.slot.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-ink)}
.slot.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad-ink)}
.explain{margin-top:16px;font-size:14.5px;color:var(--muted);font-weight:700}

/* Footer feedback */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.fb-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.fb.good{background:var(--ok-soft);border-color:var(--ok-soft)}
.fb.badf{background:var(--bad-soft);border-color:var(--bad-soft)}
.fb .msg{display:flex;gap:12px;align-items:flex-start}
.fb .ic{flex:none;width:44px;height:44px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center}
.fb .ic svg{width:26px;height:26px}
.fb.good .msg{color:var(--ok-ink)}.fb.badf .msg{color:var(--bad-ink)}
.fb .msg b{display:block;font-size:19px;font-weight:900;margin-bottom:2px}
.fb .msg span{font-size:14.5px;font-weight:700;line-height:1.35}
.fb .msg .ans{font-weight:900}

/* Result */
.result{padding:40px 20px calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;flex:1;justify-content:center}
.result h1{font-size:28px;font-weight:900}
.result p{margin:0;color:var(--muted);font-weight:700}
.medal{width:120px;height:120px;border-radius:50%;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;border:4px solid var(--gold)}
.medal svg{width:64px;height:64px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:400px}
.tile{border-radius:14px;border:2px solid var(--c);overflow:hidden;background:var(--surface)}
.tile .l{background:var(--c);color:#fff;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:5px}
.tile .v{font-size:24px;font-weight:900;padding:10px 4px;color:var(--c);font-variant-numeric:tabular-nums}
.result .acts{display:flex;flex-direction:column;gap:10px;width:100%;max-width:400px;margin-top:8px}
.review-list{width:100%;max-width:400px;text-align:left;font-size:14px;color:var(--muted);font-weight:700}
.review-list li{margin:4px 0}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px}
.modal .box{background:var(--surface);border-radius:18px;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px}
.modal h3{font-size:18px;font-weight:900}
.modal p{margin:0;color:var(--muted);font-weight:700;font-size:14.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:600px){.home{padding-top:22px}.hero h1{font-size:24px}}
</style>
<div id="app" aria-live="polite"></div>
<script src="units.js"></script>
<script>
const KEY="psyche.v1";
let S=load();
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&typeof o==='object')return Object.assign({xp:0,streak:0,last:null,lessons:{}},o);}}catch(e){}return{xp:0,streak:0,last:null,lessons:{}};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function today(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function touchStreak(){const t=today();if(S.last===t)return;const y=new Date();y.setDate(y.getDate()-1);const ys=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();S.streak=(S.last===ys)?S.streak+1:1;S.last=t;}
function streakAlive(){if(!S.last)return false;const t=today();const y=new Date();y.setDate(y.getDate()-1);const ys=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();return S.last===t||S.last===ys;}
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const buzz=p=>{try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}};
const ICON={
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>',
  fire:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.6 2c.4 3.2 3.9 4.6 3.9 9.4 0 1.5-.4 2.7-1.1 3.6.2-2.6-1.3-4.3-2.6-5.2.2 2.2-1.9 3.4-1.9 5.9 0 1 .3 1.8.8 2.4C8.6 17.6 6 15.4 6 11.6 6 6.6 12 5.6 12.6 2z"/></svg>',
  bolt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  cup:'<svg viewBox="0 0 32 32" aria-hidden="true"><g fill="currentColor"><ellipse cx="10.5" cy="11.5" rx="5.6" ry="7.2" transform="rotate(-32 10.5 11.5)"/><ellipse cx="21.5" cy="11.5" rx="5.6" ry="7.2" transform="rotate(32 21.5 11.5)"/><ellipse cx="11.5" cy="21.5" rx="4.2" ry="5.4" transform="rotate(32 11.5 21.5)" opacity=".75"/><ellipse cx="20.5" cy="21.5" rx="4.2" ry="5.4" transform="rotate(-32 20.5 21.5)" opacity=".75"/></g><rect x="14.6" y="8" width="2.8" height="18" rx="1.4" fill="#E8A33D"/><path d="M15 8.5c-1-2.5-2.5-4-4-4.5M17 8.5c1-2.5 2.5-4 4-4.5" stroke="#E8A33D" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>',
  trophy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0V4z"/><path d="M7 6H4v2a3 3 0 003 3M17 6h3v2a3 3 0 01-3 3"/></svg>'
};
const allLessons=()=>UNITS.flatMap(u=>u.lessons.map(l=>({u,l})));

/* ---------- Écran d'accueil ---------- */
function home(){
  const total=allLessons().length;const done=allLessons().filter(x=>S.lessons[x.l.id]&&S.lessons[x.l.id].done).length;
  const next=allLessons().find(x=>!(S.lessons[x.l.id]&&S.lessons[x.l.id].done));
  let h=`<div class="screen"><header class="hdr"><div class="logo">${ICON.cup.replace('viewBox','style="color:var(--brand)" viewBox')}Psyché</div><div class="stats"><div class="stat fire" title="Jours d'affilée">${ICON.fire}${streakAlive()?S.streak:0}</div><div class="stat xp" title="Points d'expérience">${ICON.bolt}${S.xp}</div></div></header>
  <div class="home">
  <section class="hero"><h1>M2 PSP · Santé mentale et psychologie de la santé</h1><p>${UNITS.length} unités tirées des six documents du cours : crédibilité et mésinformation (Brivael Hémon), promotion, prévention et politiques de santé mentale (Delphine Moreau), questionnaire et modèles motivationnels (Jocelyn Raude). Chaque leçon dure trois à cinq minutes et te fait gagner des points.</p>
  <div class="prog"><i style="width:${total?Math.round(done/total*100):0}%"></i></div><div class="prog-l">${done} leçon${done>1?'s':''} sur ${total} terminée${done>1?'s':''}</div>
  <div class="row" style="margin-top:12px">${next?`<button class="btn" data-start="${next.l.id}">${done?'Continuer':'Commencer'}</button>`:''}<button class="btn ghost" data-review="1">Révision mixte</button><a class="btn ghost" href="${FICHES_URL}">Fiches détaillées</a></div></section>`;
  UNITS.forEach(u=>{
    const ld=u.lessons.filter(l=>S.lessons[l.id]&&S.lessons[l.id].done).length;
    const gold=u.lessons.filter(l=>S.lessons[l.id]&&S.lessons[l.id].best===100).length;
    h+=`<section class="unit" style="--c:var(${u.c});--cd:var(${u.c}d)"><div class="unit-h"><div><div class="n">Unité ${u.n}</div><h2>${esc(u.title)}</h2><div class="who">${esc(u.who)}</div></div><div class="crown">${ICON.star}${gold}/${u.lessons.length}</div></div><div class="path">`;
    u.lessons.forEach((l,i)=>{
      const st=S.lessons[l.id];const isNext=next&&next.l.id===l.id;
      const cls=st&&st.done?(st.best===100?'node gold':'node done'):(isNext?'node next':'node');
      const inner=st&&st.done?(st.best===100?ICON.star:ICON.check):(i+1);
      const sub=st&&st.done?`Meilleur score : ${st.best} %`:(isNext?'À faire maintenant':`${l.q.length} questions`);
      h+=`<button class="${cls}" data-start="${l.id}"><span class="disc">${inner}</span><span><div class="t">${esc(l.title)}</div><div class="s">${sub}</div></span></button>`;
    });
    h+=`</div></section>`;
  });
  h+=`<p class="foot-note">Ta progression est enregistrée sur cet appareil. Les <a href="${FICHES_URL}">fiches détaillées</a> reprennent chaque unité avec les définitions, les tableaux et les références à citer.</p></div></div>`;
  app.innerHTML=h;window.scrollTo(0,0);
  app.querySelectorAll('[data-start]').forEach(b=>b.addEventListener('click',()=>{const x=allLessons().find(y=>y.l.id===b.dataset.start);startLesson(x.u,x.l,x.l.q,false);}));
  app.querySelector('[data-review]').addEventListener('click',()=>{
    const doneQ=allLessons().filter(x=>S.lessons[x.l.id]&&S.lessons[x.l.id].done).flatMap(x=>x.l.q.map(q=>Object.assign({},q,{_u:x.u})));
    const pool=doneQ.length>=12?doneQ:allLessons().flatMap(x=>x.l.q.map(q=>Object.assign({},q,{_u:x.u})));
    startLesson(null,{id:'review',title:'Révision mixte'},shuffle(pool).slice(0,12),true);
  });
}

/* ---------- Moteur de leçon ---------- */
let L=null;
function startLesson(u,l,qs,isReview){
  L={u,l,isReview,queue:qs.map((q,i)=>({q,i,retry:false})),total:qs.length,idx:0,firstTry:0,seen:new Set(),wrongOnce:new Set(),wrongList:[],cur:null,answer:null,checked:false};
  nextQ();
}
function nextQ(){
  if(!L.queue.length)return finish();
  L.cur=L.queue.shift();L.answer=null;L.checked=false;renderQ();
}
function progressPct(){const solved=L.seen.size- L.queue.filter(x=>x.retry).length;return Math.max(0,Math.min(100,Math.round(((L.total-L.queue.length-(L.cur?1:0))/L.total)*100)));}
function renderQ(){
  const {q}=L.cur;const u=L.u||q._u||UNITS[0];const color=`var(${u.c})`;
  const kindName={qcm:'Choisis la bonne réponse',vf:'Vrai ou faux ?',trou:'Complète la phrase',assoc:'Associe les paires',ordre:'Remets dans l\'ordre'}[q.t];
  const done=L.total-L.queue.length-1;
  let h=`<div class="screen" style="--c:${color}"><div class="lesson"><div class="lbar"><button class="x" data-quit aria-label="Quitter la leçon">${ICON.x.replace('<svg','<svg style="width:20px;height:20px"')}</button><div class="pb"><i style="width:${Math.round(done/L.total*100)}%"></i></div><div class="cnt">${done}/${L.total}</div></div>
  <div class="kind">${L.isReview?esc(u.title)+' · ':''}${kindName}${L.cur.retry?' · à nouveau':''}</div>`;
  if(q.t==='qcm'){
    L.view={opts:shuffle(q.o.map((t,i)=>({t,i})))};
    h+=`<div class="qtext">${esc(q.q)}</div><div class="opts">${L.view.opts.map((o,k)=>`<button class="opt" data-pick="${k}"><span class="k">${k+1}</span><span>${esc(o.t)}</span></button>`).join('')}</div>`;
  }else if(q.t==='vf'){
    h+=`<div class="qtext">${esc(q.q)}</div><div class="vf"><button class="opt" data-pick="1">Vrai</button><button class="opt" data-pick="0">Faux</button></div>`;
  }else if(q.t==='trou'){
    L.view={opts:shuffle(q.o.map((t,i)=>({t,i})))};
    h+=`<div class="qtext" id="qt">${esc(q.q).replace('___','<span class="gap" id="gap">&nbsp;</span>')}</div><div class="bank">${L.view.opts.map((o,k)=>`<button class="chipb" data-pick="${k}">${esc(o.t)}</button>`).join('')}</div>`;
  }else if(q.t==='assoc'){
    const left=shuffle(q.p.map((p,i)=>({t:p[0],i})));const right=shuffle(q.p.map((p,i)=>({t:p[1],i})));
    L.view={left,right,pickL:null,pickR:null,matched:new Set(),errors:0};
    h+=`<div class="qtext">${esc(q.q)}</div><div class="assoc">${left.map((o,k)=>`<button class="opt" data-l="${k}">${esc(o.t)}</button><button class="opt" data-r="${k}">${esc(right[k].t)}</button>`).join('')}</div>`;
  }else if(q.t==='ordre'){
    L.view={items:shuffle(q.items.map((t,i)=>({t,i}))),slots:[]};
    h+=`<div class="qtext">${esc(q.q)}</div><div class="slots" id="slots"></div><div class="bank" id="bank"></div>`;
  }
  h+=`</div><div class="fb" id="fb"><div class="fb-in"><button class="btn wide" id="check" disabled>Vérifier</button></div></div></div>`;
  app.innerHTML=h;window.scrollTo(0,0);
  app.querySelector('[data-quit]').addEventListener('click',quitPrompt);
  const check=document.getElementById('check');
  check.addEventListener('click',()=>{if(L.checked)nextQ();else doCheck();});
  if(q.t==='qcm'||q.t==='vf'){
    app.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{if(L.checked)return;app.querySelectorAll('[data-pick]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');L.answer=+b.dataset.pick;check.disabled=false;}));
  }else if(q.t==='trou'){
    app.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{if(L.checked)return;app.querySelectorAll('[data-pick]').forEach(x=>x.classList.remove('used'));b.classList.add('used');L.answer=+b.dataset.pick;const g=document.getElementById('gap');g.textContent=L.view.opts[L.answer].t;g.classList.add('filled');check.disabled=false;}));
  }else if(q.t==='assoc'){
    const V=L.view;
    const upd=()=>{app.querySelectorAll('[data-l]').forEach(b=>{const k=+b.dataset.l;b.classList.toggle('sel',V.pickL===k);b.classList.toggle('gone',V.matched.has('L'+k));b.disabled=V.matched.has('L'+k);});app.querySelectorAll('[data-r]').forEach(b=>{const k=+b.dataset.r;b.classList.toggle('sel',V.pickR===k);b.classList.toggle('gone',V.matched.has('R'+k));b.disabled=V.matched.has('R'+k);});};
    const tryMatch=()=>{if(V.pickL===null||V.pickR===null)return;const lb=app.querySelector(`[data-l="${V.pickL}"]`),rb=app.querySelector(`[data-r="${V.pickR}"]`);
      if(V.left[V.pickL].i===V.right[V.pickR].i||q.p[V.left[V.pickL].i][1]===V.right[V.pickR].t){V.matched.add('L'+V.pickL);V.matched.add('R'+V.pickR);lb.classList.add('right');rb.classList.add('right');buzz(15);}
      else{V.errors++;lb.classList.add('wrong','shake');rb.classList.add('wrong','shake');buzz([30,40,30]);setTimeout(()=>{lb.classList.remove('wrong','shake');rb.classList.remove('wrong','shake');},450);}
      V.pickL=null;V.pickR=null;setTimeout(upd,V.matched.size===V.left.length*2?0:120);
      if(V.matched.size===V.left.length*2){L.answer=V.errors;setTimeout(doCheck,250);}};
    app.querySelectorAll('[data-l]').forEach(b=>b.addEventListener('click',()=>{if(L.checked)return;V.pickL=V.pickL===+b.dataset.l?null:+b.dataset.l;upd();tryMatch();}));
    app.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>{if(L.checked)return;V.pickR=V.pickR===+b.dataset.r?null:+b.dataset.r;upd();tryMatch();}));
  }else if(q.t==='ordre'){
    const V=L.view;const slots=document.getElementById('slots'),bank=document.getElementById('bank');
    const draw=()=>{slots.innerHTML=q.items.map((_,k)=>{const it=V.slots[k];return `<button class="slot ${it?'full':''}" data-s="${k}"><span class="i">${k+1}</span><span>${it?esc(it.t):''}</span></button>`;}).join('');
      bank.innerHTML=V.items.map((it,k)=>`<button class="chipb ${V.slots.some(s=>s&&s.k===k)?'used':''}" data-b="${k}" ${V.slots.some(s=>s&&s.k===k)?'disabled':''}>${esc(it.t)}</button>`).join('');
      slots.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>{if(L.checked)return;const k=+b.dataset.s;if(V.slots[k]){V.slots.splice(k,1);draw();}}));
      bank.querySelectorAll('[data-b]').forEach(b=>b.addEventListener('click',()=>{if(L.checked)return;V.slots.push({t:V.items[+b.dataset.b].t,i:V.items[+b.dataset.b].i,k:+b.dataset.b});draw();}));
      check.disabled=V.slots.length!==q.items.length;L.answer=V.slots.map(s=>s.i);};
    draw();
  }
}
function doCheck(){
  const {q}=L.cur;let ok=false,shown='';
  if(q.t==='qcm'){ok=L.view.opts[L.answer].i===q.a;shown=q.o[q.a];app.querySelectorAll('[data-pick]').forEach(b=>{const k=+b.dataset.pick;b.disabled=true;if(L.view.opts[k].i===q.a)b.classList.add('right');else if(k===L.answer)b.classList.add('wrong');});}
  else if(q.t==='vf'){ok=(L.answer===1)===q.a;shown=q.a?'Vrai':'Faux';app.querySelectorAll('[data-pick]').forEach(b=>{const k=+b.dataset.pick;b.disabled=true;if((k===1)===q.a)b.classList.add('right');else if(k===L.answer)b.classList.add('wrong');});}
  else if(q.t==='trou'){ok=L.view.opts[L.answer].i===q.a;shown=q.o[q.a];app.querySelectorAll('[data-pick]').forEach(b=>{const k=+b.dataset.pick;b.disabled=true;if(L.view.opts[k].i===q.a)b.classList.add('right');else if(k===L.answer)b.classList.add('wrong');});const g=document.getElementById('gap');if(g){g.textContent=q.o[q.a];g.style.color=ok?'var(--ok-ink)':'var(--bad-ink)';}}
  else if(q.t==='assoc'){ok=L.answer===0;shown=L.answer===1?'une erreur d\'association':L.answer+' erreurs d\'association';}
  else if(q.t==='ordre'){ok=L.answer.every((v,k)=>v===k);shown=q.items.join(' → ');app.querySelectorAll('[data-s]').forEach((b,k)=>{b.disabled=true;b.classList.add(L.answer[k]===k?'right':'wrong');});app.querySelectorAll('[data-b]').forEach(b=>b.disabled=true);}
  L.checked=true;L.seen.add(L.cur.i);
  if(ok){buzz(20);if(!L.cur.retry)L.firstTry++;}
  else{buzz([40,60,40]);if(!L.cur.retry){L.wrongOnce.add(L.cur.i);L.wrongList.push(q);L.queue.push({q,i:L.cur.i,retry:true});}}
  const fb=document.getElementById('fb');fb.classList.add(ok?'good':'badf');
  const title=ok?['Exact !','Bien joué !','Parfait !','Oui !'][Math.floor(Math.random()*4)]:'Pas tout à fait';
  const body=ok?(q.e?esc(q.e):''):`${q.t==='assoc'?'':'<span class="ans">Réponse : '+esc(shown)+'</span><br>'}${q.e?esc(q.e):''}`;
  fb.querySelector('.fb-in').innerHTML=`<div class="msg"><div class="ic" style="color:${ok?'var(--ok)':'var(--bad)'}">${ok?ICON.check:ICON.x}</div><div><b>${title}</b><span>${body}</span></div></div><button class="btn wide ${ok?'ok':'bad'}" id="check">Continuer</button>`;
  const btn=document.getElementById('check');btn.addEventListener('click',nextQ);btn.focus({preventScroll:true});
  document.querySelector('.lbar .pb i').style.width=Math.round((L.total-L.queue.length)/L.total*100)+'%';
  document.querySelector('.lbar .cnt').textContent=(L.total-L.queue.length)+'/'+L.total;
}
function quitPrompt(){
  const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box"><h3>Quitter la leçon ?</h3><p>La progression de cette leçon ne sera pas enregistrée.</p><button class="btn wide" id="stay">Continuer la leçon</button><button class="btn ghost wide" id="leave">Quitter</button></div>`;
  document.body.appendChild(m);m.querySelector('#stay').addEventListener('click',()=>m.remove());m.querySelector('#leave').addEventListener('click',()=>{m.remove();L=null;home();});
}
function finish(){
  const acc=Math.round(L.firstTry/L.total*100);const perfect=L.wrongOnce.size===0;
  const xp=L.firstTry*10+(perfect?20:0)+(L.isReview?5:0);
  S.xp+=xp;touchStreak();
  if(!L.isReview){const prev=S.lessons[L.l.id]||{done:false,best:0};S.lessons[L.l.id]={done:true,best:Math.max(prev.best||0,acc)};}
  save();
  const color=L.u?`var(${L.u.c})`:'var(--brand)';
  const title=perfect?'Sans faute !':acc>=75?'Leçon terminée !':'Terminé, on y retourne bientôt';
  const sub=perfect?'Tu as répondu juste du premier coup à toutes les questions.':`${L.firstTry} bonne${L.firstTry>1?'s':''} réponse${L.firstTry>1?'s':''} du premier coup sur ${L.total}. Les questions manquées te sont revenues en fin de leçon.`;
  let h=`<div class="screen"><div class="result" style="--c:${color}"><div class="medal" style="border-color:${perfect?'var(--gold)':color};background:${perfect?'var(--gold-soft)':'var(--surface-2)'};color:${perfect?'var(--gold)':color}">${perfect?ICON.star:ICON.trophy}</div><h1>${title}</h1><p>${sub}</p>
  <div class="tiles"><div class="tile" style="--c:var(--gold-dark)"><div class="l">XP gagnés</div><div class="v">+${xp}</div></div><div class="tile" style="--c:${color}"><div class="l">Précision</div><div class="v">${acc} %</div></div><div class="tile" style="--c:#E0632B"><div class="l">Série</div><div class="v">${S.streak} j</div></div></div>`;
  if(L.wrongList.length){h+=`<div class="review-list"><b>À revoir dans les fiches :</b><ul>${L.wrongList.slice(0,5).map(q=>`<li>${esc(q.q.replace('___','…'))}</li>`).join('')}</ul></div>`;}
  h+=`<div class="acts">${!perfect?`<button class="btn" id="again">Refaire la leçon</button>`:''}<button class="btn ${perfect?'':'ghost'}" id="back">Continuer</button><a class="btn ghost" href="${FICHES_URL}">Ouvrir les fiches</a></div></div></div>`;
  app.innerHTML=h;window.scrollTo(0,0);
  const again=document.getElementById('again');if(again)again.addEventListener('click',()=>{const u=L.u,l=L.l,r=L.isReview;const qs=r?shuffle(allLessons().flatMap(x=>x.l.q.map(q=>Object.assign({},q,{_u:x.u})))).slice(0,12):l.q;startLesson(u,l,qs,r);});
  document.getElementById('back').addEventListener('click',()=>{L=null;home();});
}
home();
</script>
